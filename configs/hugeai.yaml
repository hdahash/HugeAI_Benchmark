# routerbench configuration for the real hugeai.sa router, adjusted against
# the actual source at hdahash/hugeai (backend/models/schemas.py,
# backend/config.py, backend/main.py, backend/core/billing.py).
#
# Before running:
#   export HUGEAI_API_KEY="sk-..."

router:
  base_url: "https://hugeai.sa"
  chat_path: "/v1/chat/completions"
  method: "POST"
  api_key_env: "HUGEAI_API_KEY"
  auth_header_name: "Authorization"
  auth_header_format: "Bearer {api_key}"
  extra_headers: {}
  timeout_s: 30.0
  max_retries: 2
  retry_backoff_s: 0.5
  # Verified against backend/models/schemas.py (Usage/Choice/ChatResponse) --
  # unchanged from the generic defaults, they already match exactly.
  response_model_path: "model"
  response_content_path: "choices.0.message.content"
  response_input_tokens_path: "usage.prompt_tokens"
  response_output_tokens_path: "usage.completion_tokens"
  # ChatRequest.model (backend/models/schemas.py) is a REQUIRED field with no
  # default -- omitting it (routerbench's previous behavior for non-forced
  # calls) gets a 422 from the real service. "gpt-4" is a deliberate choice,
  # not an arbitrary placeholder: it's the model the gateway's own code
  # comments use as the running example of what a customer requests while
  # the router silently substitutes a cheaper backend (backend/core/billing.py
  # calculate_customer_price docstring: "customer pays for GPT-4 price, we
  # route to Gemini and pay 60x less"). Requesting it consistently is what
  # lets response.model reveal the router's real downgrade behavior per prompt.
  request_extra_fields:
    model: "gpt-4"

# $ per 1,000 tokens, keyed by the model name hugeai.sa reports in its "model"
# response field -- i.e. the ACTUAL backend that served the request (visible
# in the report's model-distribution table), NOT the "gpt-4" you requested.
#
# Two different cost numbers exist in backend/core/billing.py, and this
# table intentionally uses the one that matches response.model:
#   - calculate_provider_cost: what hugeai.sa itself pays the real backend
#     (PROVIDER_COSTS below) -- keyed by the SAME model names response.model
#     reports, so this is what routerbench can actually price per request.
#   - calculate_customer_price: what YOU get billed -- a flat
#     CUSTOMER_PRICING_PER_1M rate based on the "gpt-4" you requested,
#     completely independent of which backend served it. This framework
#     doesn't compute that number today (it would be constant per request
#     given the fixed request_extra_fields.model above, so there'd be
#     nothing to route-optimize against) -- say if you want it added as a
#     separate "amount billed" figure alongside the backend-cost numbers below.
#
# Values are backend/config.py's PROVIDER_COSTS defaults, converted from
# per-1M to per-1K. Single blended rate for all tokens (not split
# input/output), so input_per_1k == output_per_1k -- splitting an identical
# rate across both still sums to the same total. These are the values
# shipped in the repo; a deployed .env can override them (pydantic-settings
# reads env at startup) -- worth spot-checking against an admin/billing
# endpoint if totals look off. ollama entries are $0 (self-hosted/local).
pricing:
  gpt-4: {input_per_1k: 0.03, output_per_1k: 0.03}
  gpt-4-turbo: {input_per_1k: 0.01, output_per_1k: 0.01}
  gpt-4o: {input_per_1k: 0.0025, output_per_1k: 0.0025}
  gpt-4o-mini: {input_per_1k: 0.00015, output_per_1k: 0.00015}
  gpt-3.5-turbo: {input_per_1k: 0.0005, output_per_1k: 0.0005}
  claude-3-opus: {input_per_1k: 0.015, output_per_1k: 0.015}
  claude-3-sonnet: {input_per_1k: 0.003, output_per_1k: 0.003}
  claude-3-5-sonnet-20241022: {input_per_1k: 0.003, output_per_1k: 0.003}
  claude-3-haiku: {input_per_1k: 0.00025, output_per_1k: 0.00025}
  gemini-2.0-flash: {input_per_1k: 0.0001, output_per_1k: 0.0001}
  gemini-2.0-flash-lite: {input_per_1k: 0.000075, output_per_1k: 0.000075}
  gemini-1.5-flash: {input_per_1k: 0.000075, output_per_1k: 0.000075}
  gemini-1.5-flash-8b: {input_per_1k: 0.0000375, output_per_1k: 0.0000375}
