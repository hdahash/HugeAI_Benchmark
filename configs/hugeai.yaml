# routerbench configuration for the real hugeai.sa router.
#
# Before running:
#   export HUGEAI_API_KEY="sk-..."
#
# hugeai.sa is OpenAI-compatible, so the response_*_path defaults (which
# match /v1/chat/completions) are left untouched.
#
# TODO once you tell routerbench the model names your router routes
# between: fill in `pricing` below (used for cost metrics) and, if you know
# which category should route to which model, add "expected_model" back
# into data/hugeai_prompts.jsonl per item to get routing-accuracy scoring
# (see data/sample_prompts.jsonl for the field). Until then this config
# leaves `accuracy`'s routing check unscored (no expected_model in the
# dataset) but still captures model distribution, quality, latency, and cost.

router:
  base_url: "https://hugeai.sa"
  chat_path: "/v1/chat/completions"
  method: "POST"
  api_key_env: "HUGEAI_API_KEY"
  auth_header_name: "Authorization"
  auth_header_format: "Bearer {api_key}"
  extra_headers: {}
  timeout_s: 30.0
  max_retries: 2
  retry_backoff_s: 0.5
  response_model_path: "model"
  response_content_path: "choices.0.message.content"
  response_input_tokens_path: "usage.prompt_tokens"
  response_output_tokens_path: "usage.completion_tokens"

# $ per 1,000 tokens, keyed by the model name hugeai.sa reports in its
# "model" response field. Fill these in with your actual backend models
# and their pricing to get meaningful cost-efficiency numbers.
pricing: {}
#  gpt-4o-mini:
#    input_per_1k: 0.00015
#    output_per_1k: 0.0006
#  gpt-4o:
#    input_per_1k: 0.005
#    output_per_1k: 0.015

# Set once you know which model name represents your most expensive/largest
# backend, to compute cost savings vs. always routing there.
baseline_model: null

dataset:
  path: "data/hugeai_prompts.jsonl"

accuracy:
  enabled: true
  name: "routing_accuracy"
  concurrency: 5
  # Flip to true once baseline_model above is set to a real backend model
  # name -- doubles request volume for this scenario (routed + forced-baseline).
  compute_routing_regret: false

load:
  enabled: true
  name: "load_test"
  concurrency_levels: [1, 5, 20]
  requests_per_level: 20

reliability:
  enabled: true
  name: "reliability"
  concurrency: 10
  requests: 30
  # hugeai.sa has no documented fault-injection contract, so this stays off
  # by default -- flip to true only if the service special-cases this header.
  inject_faults: false
  fault_header: "X-Inject-Fault"
  request_timeout_s: 10.0

scorer:
  mode: "auto"   # "auto" (dispatch per item) | "heuristic" | "none"

# LLM-as-judge for open-ended items (reasoning/creative/long_context).
# Disabled until you know a real backend model name to set as `model` below
# (it inherits base_url/api_key_env from `router:` above, so once `model` is
# set this will judge responses using your own router with that model forced).
judge:
  enabled: false
  model: ""   # e.g. your largest/most capable backend model
  default_rubric: "Score 0-10: is this response helpful, accurate, and relevant to the prompt?"
  rubric:
    reasoning: "Score 0-10: does the response show valid, step-by-step logical reasoning and reach a correct conclusion?"
    creative: "Score 0-10: is the response coherent, on-topic, and reasonably creative?"
    long_context: "Score 0-10: does the response accurately and clearly cover the key trade-offs the prompt asked about?"

# Sandboxed local execution of model-generated code against dataset test
# cases (see data/hugeai_prompts.jsonl's code-1/code-6). This doesn't need
# any of the above filled in -- it's self-contained regardless of your
# backend model names. Read the SECURITY note in
# routerbench/scoring/code_exec.py before running it anywhere but
# disposable/ephemeral infrastructure.
code_exec:
  enabled: true
  timeout_s: 5.0
  memory_limit_mb: 256

output:
  dir: "reports"
  formats: ["json", "html"]
