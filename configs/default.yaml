# routerbench configuration.
#
# Points at the bundled mock router by default so `routerbench run` works
# out of the box. To benchmark your real router, change `router.base_url`
# and the `response_*_path` fields to match its actual JSON response shape.

router:
  base_url: "http://127.0.0.1:8000"
  chat_path: "/v1/chat/completions"
  method: "POST"
  api_key_env: null            # e.g. "ROUTER_API_KEY" -- read from env, never hardcode
  auth_header_name: "Authorization"
  auth_header_format: "Bearer {api_key}"
  extra_headers: {}
  timeout_s: 10.0
  max_retries: 2
  retry_backoff_s: 0.3
  # Dot-paths resolved against the router's JSON response.
  response_model_path: "model"
  response_content_path: "choices.0.message.content"
  response_input_tokens_path: "usage.prompt_tokens"
  response_output_tokens_path: "usage.completion_tokens"

# $ per 1,000 tokens, keyed by the model name your router reports in
# response_model_path. Used for cost-efficiency metrics.
pricing:
  small-model:
    input_per_1k: 0.0001
    output_per_1k: 0.0002
  medium-model:
    input_per_1k: 0.001
    output_per_1k: 0.002
  large-model:
    input_per_1k: 0.005
    output_per_1k: 0.015

# If set, computes what the accuracy-scenario traffic would have cost had
# every request been forced to this model, and reports savings vs. that.
baseline_model: "large-model"

# Caps aggregate request rate across all scenarios + judge calls -- unset
# (no throttling) is fine for the local mock router. Set this to a real
# rate-limited service's actual limit (with headroom) to avoid self-inflicted
# 429s contaminating the load/reliability numbers -- see configs/hugeai.yaml
# for a worked example.
rate_limit_rps: null

dataset:
  path: "data/sample_prompts.jsonl"

accuracy:
  enabled: true
  name: "routing_accuracy"
  concurrency: 5
  # Also fires each prompt forced to baseline_model and compares quality/cost
  # against what the router actually chose -- see metrics/regret.py.
  compute_routing_regret: true

load:
  enabled: true
  name: "load_test"
  concurrency_levels: [1, 5, 20]
  requests_per_level: 20

reliability:
  enabled: true
  name: "reliability"
  concurrency: 10
  requests: 30
  inject_faults: true
  fault_header: "X-Inject-Fault"
  request_timeout_s: 5.0

scorer:
  mode: "auto"   # "auto" (dispatch per item) | "heuristic" | "none"

# LLM-as-judge for open-ended items (reasoning/creative/long_context) that
# have no verifiable ground truth. Left unset, base_url/chat_path/api_key_env
# inherit from `router:` above -- here that means the mock router judges its
# own output using its "large-model" tier, which is enough to demo the
# scoring path end to end. Point this at a real, separate judge model for
# anything beyond a demo.
judge:
  enabled: true
  model: "large-model"
  default_rubric: "Score 0-10: is this response helpful, accurate, and relevant to the prompt?"
  rubric:
    reasoning: "Score 0-10: does the response show valid, step-by-step logical reasoning and reach a correct conclusion?"
    creative: "Score 0-10: is the response coherent, on-topic, and reasonably creative?"
    long_context: "Score 0-10: does the response accurately and clearly cover the key trade-offs the prompt asked about?"

# Sandboxed local execution of model-generated code against dataset test
# cases (see data/sample_prompts.jsonl's code-1/code-6 for the schema).
# Read the SECURITY note in routerbench/scoring/code_exec.py before pointing
# this at anything other than disposable/ephemeral infrastructure.
code_exec:
  enabled: true
  timeout_s: 5.0
  memory_limit_mb: 256

output:
  dir: "reports"
  formats: ["json", "html"]
