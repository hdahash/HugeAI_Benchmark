[project]
name = "routerbench"
version = "0.1.0"
description = "Benchmark framework for LLM router services: routing accuracy, latency/throughput, cost efficiency, and reliability."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
mock = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
routerbench = "routerbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["routerbench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
